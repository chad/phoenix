[package]
name = "phoenix-salsa-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "Does salsa's incremental engine do what Phoenix hand-rolls? A spike, not a port."

[dependencies]
salsa = { version = "0.28.2", features = ["persistence", "macros", "inventory", "accumulator"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[profile.dev]
opt-level = 0

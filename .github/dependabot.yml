  # ── CI actions ─────────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ['*']

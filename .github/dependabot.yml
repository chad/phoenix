# Dependency updates for Phoenix.
#
# The problem this file solves: without it, Dependabot opened one PR per package per
# manifest. With a root manifest plus seven generated examples that all share the same
# toolchain, a single vitest advisory became eight PRs, and the queue grew faster than
# anyone drained it — twenty open PRs and eighty-three unaddressed advisories.
#
# Two rules make the queue tractable:
#
#   1. GROUP aggressively. The examples are generated artifacts that share one pinned
#      toolchain (src/toolchain.ts), so their updates are one decision, not eight PRs.
#   2. IGNORE major bumps for libraries the codegen templates call directly. A major on
#      hono / zod / better-sqlite3 changes the API Phoenix *emits*; it needs a migration
#      with a regenerated example, not an automerged patch. Those are raised deliberately.
#
# Note that a version bump in an example's package.json is NOT the real fix — the versions
# are generated from src/toolchain.ts, and tests/unit/toolchain.test.ts fails if a literal
# range reappears in an emitter. Treat example PRs as a signal to bump the canonical pin.

version: 2

updates:
  # ── The compiler itself ────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    # Compiler and test-runner majors are migrations, not updates, and CI proved it: the first
    # grouped PR here proposed TypeScript 7 and failed `npm run build` with ~40 TS2591 errors
    # (the native compiler no longer picks up @types/node the way 5.x did). That is real work
    # with a tsconfig change behind it, and it belongs in a deliberate PR that also moves the
    # generated-project pin in src/toolchain.ts. Withheld here so it is scheduled rather than
    # arriving as a red PR nobody can merge.
    #
    # This is deferral, not dismissal — TypeScript 7 and @types/node 26 are tracked work.
    ignore:
      - dependency-name: 'typescript'
        update-types: [version-update:semver-major]
      - dependency-name: 'vitest'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      # Build + test toolchain moves as one unit; a vitest bump drags vite/esbuild/rollup
      # with it, and reviewing those separately is noise.
      toolchain:
        patterns: ['typescript', 'vitest', '@types/node', 'vite', 'esbuild', 'rollup', 'postcss']
      # Everything else, still batched — this repo has three direct devDependencies.
      remaining:
        patterns: ['*']
        exclude-patterns: ['typescript', 'vitest', '@types/node', 'vite', 'esbuild', 'rollup', 'postcss']

  # ── Generated examples ─────────────────────────────────────────────────────────
  # One grouped PR per example instead of one per package. Majors on codegen-facing
  # runtime libraries are withheld: they are architecture migrations, not security bumps.
  - package-ecosystem: npm
    directory: /examples/phoenix-self
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    labels: [dependencies, examples]
    # Majors on the toolchain are withheld: these versions are OWNED by src/toolchain.ts,
    # and tests/unit/toolchain.test.ts fails if an example drifts from that pin. A TypeScript
    # or vitest major is a compiler migration for every generated project, decided once at
    # the pin — not per example.
    ignore:
      - dependency-name: 'typescript'
        update-types: [version-update:semver-major]
      - dependency-name: 'vitest'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      example-deps:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /examples/pixel-wars
